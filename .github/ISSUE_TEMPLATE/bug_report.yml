name: Bug report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: dsh-version
    attributes:
      label: DSH Version
      description: What version of DeepSeek Harness are you using? (e.g. 0.2.1-rc.2)
      placeholder: 0.2.1-rc.2
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Plugin Configuration (cordis.patch.yml)
      description: Your think-intensity configuration snippet (please redact private API keys).
      render: yaml
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
